<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
  <title>FLOVER-FLIX · 프로미스나인 팬 아카이브</title>
  <meta name="description" content="프로미스나인(fromis_9)의 음악방송 · 직캠 · 자체콘텐츠를 한 곳에서 모아보는 비영리 팬 아카이브." />
  <link rel="icon" href="image/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />

  <!-- 테마: 시스템 설정 또는 저장값 (FOUC 방지) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ff-theme");
        var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    })();
  </script>

  <!-- 제목: 함렛(Google Fonts) · 본문: 나눔스퀘어라운드(style.css 의 @font-face) · Pretendard 는 빠진 글자용 보조 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/css/nanum-round.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <div class="app">
    <!-- 좌측 플로팅 드로어 (1단 메뉴만. 하위 분류는 각 화면 제목의 풀다운) -->
    <aside class="sidebar" id="sidebar" aria-label="사이트 메뉴">
      <div class="drawer-panel drawer-primary">
        <div class="sidebar-head">
          <a class="brand" href="./" aria-label="FLOVER-FLIX 홈">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-text">FLOVER<span class="brand-accent">-FLIX</span></span>
          </a>
          <button class="icon-btn" id="drawerClose" aria-label="메뉴 닫기">
            <i data-lucide="x"></i>
          </button>
        </div>

        <nav class="nav nice-scroll" id="navPane1" aria-label="카테고리"></nav>

        <div class="sidebar-foot">
          <button class="nav-item nav-about" data-view="about">
            <i data-lucide="info" class="nav-ico"></i><span class="nav-label">About.</span>
          </button>
          <p class="side-note">비영리 팬 아카이브<br />영상은 YouTube 임베드로만 제공<br />사진은 썸네일만 저장, 원본은 SBS 링크</p>
        </div>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <!-- 본문 -->
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn hamburger" id="hamburger" aria-label="메뉴 열기" aria-expanded="false">
          <i data-lucide="menu"></i>
        </button>
        <a class="brand topbar-brand" href="./" aria-label="FLOVER-FLIX 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">FLOVER<span class="brand-accent">-FLIX</span></span>
        </a>
        <h1 class="topbar-title" id="topbarTitle">홈</h1>
        <div class="search-box">
          <i data-lucide="search" class="search-ico"></i>
          <input type="search" id="searchInput" placeholder="영상 검색…" autocomplete="off" aria-label="영상 검색" />
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="테마 전환">
          <i data-lucide="sun" class="ico-light"></i>
          <i data-lucide="moon" class="ico-dark"></i>
        </button>
      </header>

      <main id="content" class="content">
        <div class="loading" id="loading">불러오는 중…</div>
      </main>

      <footer class="site-footer">
        <p class="meta-line" id="metaLine"></p>
        <button class="link-btn" data-view="about">
          사이트 소개 및 저작권 안내 <i data-lucide="arrow-right"></i>
        </button>
      </footer>
    </div>
  </div>

  <!-- 영상 재생 모달 -->
  <div class="modal" id="videoModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="닫기"><i data-lucide="x"></i></button>
      <div class="modal-player" id="modalPlayer"></div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p class="modal-sub" id="modalSub"></p>
        <div class="modal-badges" id="modalBadges"></div>
        <a class="modal-yt" id="modalYtLink" target="_blank" rel="noopener noreferrer">
          YouTube에서 보기 <i data-lucide="external-link"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- 현장포토 뷰어: 썸네일 → SBS 원본 -->
  <div class="modal photo-viewer" id="photoViewer" hidden>
    <div class="modal-backdrop" data-pclose></div>
    <div class="pv-panel" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
      <button class="modal-close" data-pclose aria-label="닫기"><i data-lucide="x"></i></button>
      <div class="pv-stage">
        <button class="pv-nav pv-prev" id="pvPrev" aria-label="이전 사진"><i data-lucide="chevron-left"></i></button>
        <img id="pvImg" alt="" referrerpolicy="no-referrer" />
        <button class="pv-nav pv-next" id="pvNext" aria-label="다음 사진"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="pv-info">
        <div class="pv-text">
          <h2 id="pvTitle"></h2>
          <p id="pvSub"></p>
        </div>
        <div class="pv-actions">
          <a class="pv-btn" id="pvOpen" target="_blank" rel="noopener noreferrer">
            원본 열기 <i data-lucide="external-link"></i>
          </a>
          <a class="pv-btn pv-btn-primary" id="pvDown" download target="_blank" rel="noopener noreferrer">
            다운로드 <i data-lucide="download"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script data-goatcounter="https://fp-pilot.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
