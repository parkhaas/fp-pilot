<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>FROMIS-FLIX · 프로미스나인 팬 아카이브</title>
  <meta name="description" content="프로미스나인(fromis_9)의 음악방송 · 직캠 · 자체콘텐츠를 한 곳에서 모아보는 비영리 팬 아카이브." />
  <link rel="icon" href="image/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 좌측 플로팅 드로어 (1단 + 옆에 뜨는 2단) -->
    <aside class="sidebar" id="sidebar" aria-label="사이트 메뉴">
      <div class="drawer-panel drawer-primary">
        <div class="sidebar-head">
          <a class="brand" href="./" aria-label="FROMIS-FLIX 홈">
            <img src="image/logo.svg" alt="" class="brand-mark" />
            <span class="brand-text">FROMIS<span class="brand-accent">-FLIX</span></span>
          </a>
          <button class="drawer-close" id="drawerClose" aria-label="메뉴 닫기">✕</button>
        </div>

        <nav class="nav" id="navPane1" aria-label="카테고리"></nav>

        <div class="sidebar-foot">
          <button class="nav-item nav-about" data-view="about">
            <span class="nav-ico">ⓘ</span> 소개
          </button>
          <p class="side-note">비영리 팬 아카이브<br />영상은 YouTube 임베드로만 제공</p>
        </div>
      </div>

      <div class="drawer-panel drawer-secondary" id="navPane2" aria-label="하위 분류">
        <button class="nav-back" id="navBack"><span aria-hidden="true">‹</span> 뒤로</button>
        <p class="nav-pane2-title" id="navPane2Title"></p>
        <div class="nav-pane2-list" id="navPane2List"></div>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <!-- 본문 -->
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="hamburger" id="hamburger" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <h1 class="topbar-title" id="topbarTitle">홈</h1>
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="영상 검색…" autocomplete="off" aria-label="영상 검색" />
        </div>
      </header>

      <div class="filter-bar" id="filterBar">
        <div class="member-filter" id="memberFilter" role="group" aria-label="멤버 필터"></div>
        <label class="sort-control">
          <span>정렬</span>
          <select id="sortSelect" aria-label="정렬 방식">
            <option value="added">추가된 순</option>
            <option value="newest">최신 발행순</option>
            <option value="oldest">오래된순</option>
            <option value="title">제목순</option>
          </select>
        </label>
      </div>

      <main id="content" class="content">
        <div class="loading" id="loading">불러오는 중…</div>
      </main>

      <footer class="site-footer">
        <p class="meta-line" id="metaLine"></p>
        <button class="link-btn" data-view="about">사이트 소개 및 저작권 안내 →</button>
      </footer>
    </div>
  </div>

  <!-- 영상 재생 모달 -->
  <div class="modal" id="videoModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="닫기">✕</button>
      <div class="modal-player" id="modalPlayer"></div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p class="modal-sub" id="modalSub"></p>
        <div class="modal-badges" id="modalBadges"></div>
        <a class="modal-yt" id="modalYtLink" target="_blank" rel="noopener noreferrer">YouTube에서 보기 ↗</a>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
