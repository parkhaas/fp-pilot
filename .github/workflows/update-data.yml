name: update-data

# 정기 수집: (1) YouTube Data API v3 로 "영상" 을 증분 갱신하고
#            (2) yt-dlp 로 "쇼츠" 만 얹은 뒤 (API 는 /shorts 탭을 못 줌)
#            data/*.json 을 커밋하고 GitHub Pages 를 재배포합니다.
# (봇의 git push 는 GITHUB_TOKEN 특성상 deploy 워크플로를 트리거하지 못하므로
#  이 워크플로 안에서 직접 배포까지 합니다.)
#
# 쇼츠 수집은 yt-dlp 라 GitHub Actions IP 에서 봇 차단을 맞을 수 있어 best-effort
# (continue-on-error) 입니다. 실패하면 기존 쇼츠 데이터를 그대로 둡니다.
# 전체 백필은 로컬에서: collect_ytdlp.py --only video → --only shorts (또는 --since 없이 API).

on:
  schedule:
    - cron: "0 */12 * * *"  # 12시간마다 (UTC) — search 쿼터 절약
  workflow_dispatch:
    inputs:
      since:
        description: "search 시작일 override (YYYY-MM-DD). 비우면 최근 30일"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect data (YouTube Data API v3)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi
          # 정기 실행은 최근 30일만 검색(쿼터 절약). 전체 백필은 로컬에서 --since 없이.
          SINCE="${{ github.event.inputs.since }}"
          [ -z "$SINCE" ] && SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          echo "증분 수집 --since $SINCE"
          python crawlers/youtube_crawler.py --config crawlers/sources.json --out data --since "$SINCE"

      - name: Collect Shorts (yt-dlp, best-effort)
        continue-on-error: true   # GitHub IP 봇 차단 시 기존 쇼츠 유지하고 계속
        run: |
          python -m pip install --quiet --upgrade yt-dlp
          python crawlers/collect_ytdlp.py --config crawlers/sources.json --out data --only shorts

      - name: Guard against data loss
        run: |
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open("data/videos.json", encoding="utf-8"))["videos"]
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/videos.json"]))["videos"]
          o, n = len(old), len(new)
          print(f"videos: {o} -> {n}")
          if o >= 50 and n < o * 0.9:
              print(f"::error::영상 수 {o} → {n} 로 급감({n/o:.0%}). 증분 수집이 기존 데이터를 삭제한 것으로 보여 커밋을 중단합니다.")
              sys.exit(1)
          PY

      - name: Commit data changes
        run: |
          git config user.name  "flover-flix-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "데이터 변경 없음"
          else
            git add data
            git commit -m "chore(data): refresh archive"
            git push
          fi

      # 데이터가 바뀌었든 아니든 최신 상태로 Pages 재배포
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5
