name: update-data

# data/*.json 을 갱신하고 변경이 있으면 커밋합니다.
# 커밋이 main 에 푸시되면 deploy 워크플로가 GitHub Pages 를 재배포합니다.
#
# 기본은 yt-dlp 수집(API 키 불필요). YOUTUBE_API_KEY 시크릿이 있으면
# 공식 API 수집(youtube_crawler.py)을 대신 사용합니다.

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "공식 API 수집 사용"
            python crawlers/youtube_crawler.py --config crawlers/sources.json --out data
          else
            echo "yt-dlp 수집 사용 (API 키 없음)"
            python -m pip install --quiet yt-dlp
            python crawlers/collect_ytdlp.py --config crawlers/collect.json --out data
          fi

      - name: Commit data changes
        run: |
          git config user.name  "fromis-flix-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "변경 없음"
          else
            git add data
            git commit -m "chore(data): refresh archive [skip ci]"
            git push
          fi
