name: update-data

# YouTube Data API v3 로 data/*.json 을 갱신하고 변경이 있으면 커밋합니다.
# 커밋이 main 에 푸시되면 deploy 워크플로가 GitHub Pages 를 재배포합니다.
#
# yt-dlp 수집(collect_ytdlp.py)은 현재 비활성화되어 있습니다.

on:
  schedule:
    - cron: "0 */12 * * *"  # 12시간마다 (UTC) — search 쿼터 절약
  workflow_dispatch:
    inputs:
      since:
        description: "search 시작일 override (YYYY-MM-DD). 비우면 최근 30일"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect data (YouTube Data API v3)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi
          # 정기 실행은 최근 30일만 검색(쿼터 절약). 전체 백필은 로컬에서 --since 없이 실행.
          SINCE="${{ github.event.inputs.since }}"
          [ -z "$SINCE" ] && SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          echo "증분 수집 --since $SINCE"
          python crawlers/youtube_crawler.py --config crawlers/sources.json --out data --since "$SINCE"

      - name: Commit data changes
        run: |
          git config user.name  "flover-flix-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "변경 없음"
          else
            git add data
            git commit -m "chore(data): refresh archive [skip ci]"
            git push
          fi
